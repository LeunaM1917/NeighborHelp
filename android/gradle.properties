org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=java-truststore/cacerts -Djavax.net.ssl.trustStorePassword=changeit
systemProp.javax.net.ssl.trustStore=java-truststore/cacerts
systemProp.javax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
android.enableJetifier=true
# Project on D: + Pub cache on C: breaks Kotlin incremental paths on Windows.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
android.lint.checkReleaseBuilds=false
